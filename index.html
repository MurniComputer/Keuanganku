<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Rekap Keuangan</title>
</head>
<body>

  <!-- Bagian Ringkasan -->
  <div>
    <h3>Total Pemasukan: Rp <span id="pemasukan">0</span></h3>
    <h3>Total Pengeluaran: Rp <span id="pengeluaran">0</span></h3>
    <h3>Total Saldo: Rp <span id="saldo">0</span></h3>
  </div>

  <hr>

  <!-- Bagian Tabel Riwayat -->
  <h3>10 Transaksi Terakhir</h3>
  <table border="1" cellpadding="5">
    <thead>
      <tr>
        <th>Jenis</th>
        <th>Kategori</th>
        <th>Jumlah</th>
        <th>Catatan</th>
      </tr>
    </thead>
    <tbody id="tabel-riwayat">
      <tr><td colspan="4">Loading data...</td></tr>
    </tbody>
  </table>

  <script>
    // Ganti dengan URL Web App Apps Script kamu yang terbaru
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzz-QoB96-PTLcTebdIcDsLYp2R5cSBO9-fZMPR4_lu2-UxJYyQUFqjxQm8eEi5-rY5OQ/exec";

    function muatData() {
      fetch(SCRIPT_URL)
        .then(response => response.json())
        .then(data => {
          // 1. Tampilkan Total
          document.getElementById('pemasukan').innerText = data.totalPemasukan.toLocaleString('id-ID');
          document.getElementById('pengeluaran').innerText = data.totalPengeluaran.toLocaleString('id-ID');
          document.getElementById('saldo').innerText = data.totalSaldo.toLocaleString('id-ID');

          // 2. Tampilkan Riwayat ke Tabel
          const tbody = document.getElementById('tabel-riwayat');
          tbody.innerHTML = ''; // Bersihkan isi tabel sementara

          if (data.riwayat.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4">Belum ada transaksi</td></tr>';
            return;
          }

          data.riwayat.forEach(item => {
            const row = `
              <tr>
                <td>${item.jenis}</td>
                <td>${item.kategori}</td>
                <td>Rp ${item.jumlah.toLocaleString('id-ID')}</td>
                <td>${item.catatan || '-'}</td>
              </tr>
            `;
            tbody.innerHTML += row;
          });
        })
        .catch(error => {
          console.error("Gagal mengambil data:", error);
          document.getElementById('tabel-riwayat').innerHTML = '<tr><td colspan="4">Gagal memuat data. Cek konsole/URL.</td></tr>';
        });
    }

    // Jalankan fungsi saat halaman selesai di-load
    window.onload = muatData;
  </script>
</body>
</html>
