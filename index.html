<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ringkasan Keuangan</title>
  <style>
    body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; margin-bottom: 15px; }
    h3, h4 { margin-top: 0; color: #333; }
    .box-saldo { background: #e8f0fe; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 10px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .box-pemasukan { background: #e6f4ea; padding: 10px; border-radius: 8px; text-align: center; color: #137333; }
    .box-pengeluaran { background: #fce8e6; padding: 10px; border-radius: 8px; text-align: center; color: #c5221f; }
    .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 5px; }
    .btn-refresh { background: #5f6368; color: white; }
    .btn-submit { background: #1a73e8; color: white; }
    input, select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f8f9fa; }
  </style>
</head>
<body>

  <div style="width: 100%; max-width: 400px;">
    
    <!-- RINGKASAN KEUANGAN -->
    <div class="card">
      <h3>Ringkasan Keuangan</h3>
      <div class="box-saldo">
        <small style="color: #1a73e8;">Total Saldo</small>
        <h2 id="saldo" style="margin: 5px 0 0 0; color: #1a73e8;">Rp 0</h2>
      </div>
      <div class="grid-2">
        <div class="box-pemasukan">
          <small>Pemasukan</small>
          <div id="pemasukan" style="font-weight:bold;">Rp 0</div>
        </div>
        <div class="box-pengeluaran">
          <small>Pengeluaran</small>
          <div id="pengeluaran" style="font-weight:bold;">Rp 0</div>
        </div>
      </div>
      <button class="btn btn-refresh" onclick="muatData()">Refresh Rekap</button>
    </div>

    <!-- FORM INPUT TRANSACTION -->
    <div class="card">
      <h3>Tambah Transaksi</h3>
      <form id="formTransaksi">
        <select id="jenis">
          <option value="Pemasukan">Pemasukan</option>
          <option value="Pengeluaran" selected>Pengeluaran</option>
        </select>
        <input type="text" id="kategori" placeholder="Kategori (Contoh: Makanan)" required>
        <input type="number" id="jumlah" placeholder="Jumlah (Rp)" required>
        <input type="text" id="catatan" placeholder="Catatan/Keterangan">
        <button type="submit" class="btn btn-submit" id="btnSimpan">Simpan Transaksi</button>
      </form>
    </div>

    <!-- TABEL 10 TRANSAKSI TERAKHIR -->
    <div class="card">
      <h3>10 Transaksi Terakhir</h3>
      <table>
        <thead>
          <tr>
            <th>Jenis</th>
            <th>Kategori</th>
            <th>Jumlah</th>
            <th>Catatan</th>
          </tr>
        </thead>
        <tbody id="tabelRiwayat">
          <tr><td colspan="4" style="text-align:center;">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    // MASUKKAN URL WEB APP APPS SCRIPT HASIL DEPLOY DI SINI:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyKkTOGYEygvXHpoa7wpyoZXRbhqo_QEk3zC7rywE6uF7c_tH8ETv86-JeRm3d8BruxAA/exec";

    // 1. Fungsi Ambil Data (doGet)
    function muatData() {
      if (!SCRIPT_URL || SCRIPT_URL === "https://script.google.com/macros/s/AKfycbyKkTOGYEygvXHpoa7wpyoZXRbhqo_QEk3zC7rywE6uF7c_tH8ETv86-JeRm3d8BruxAA/exec") {
        alert("URL Apps Script belum diisi!");
        return;
      }

      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          document.getElementById('pemasukan').innerText = 'Rp ' + data.totalPemasukan.toLocaleString('id-ID');
          document.getElementById('pengeluaran').innerText = 'Rp ' + data.totalPengeluaran.toLocaleString('id-ID');
          document.getElementById('saldo').innerText = 'Rp ' + data.totalSaldo.toLocaleString('id-ID');

          const tbody = document.getElementById('tabelRiwayat');
          tbody.innerHTML = '';

          if (!data.riwayat || data.riwayat.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Belum ada data</td></tr>';
            return;
          }

          data.riwayat.forEach(item => {
            tbody.innerHTML += `
              <tr>
                <td>${item.jenis}</td>
                <td>${item.kategori}</td>
                <td>Rp ${Number(item.jumlah).toLocaleString('id-ID')}</td>
                <td>${item.catatan || '-'}</td>
              </tr>
            `;
          });
        })
        .catch(err => {
          console.error(err);
          document.getElementById('tabelRiwayat').innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">Gagal memuat data</td></tr>';
        });
    }

    // 2. Fungsi Kirim Data (doPost)
   document.getElementById('formTransaksi').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const btn = document.getElementById('btnSimpan');
  btn.innerText = "Menyimpan...";
  btn.disabled = true;

  const payload = {
    jenis: document.getElementById('jenis').value,
    kategori: document.getElementById('kategori').value,
    jumlah: document.getElementById('jumlah').value,
    catatan: document.getElementById('catatan').value
  };

  // Menggunakan URLSearchParams / Form Data agar kompatibel dengan Apps Script tanpa kendala CORS
  fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors', // Penting agar permintaan POST tidak diblokir oleh browser
    headers: {
      'Content-Type': 'text/plain;charset=utf-8',
    },
    body: JSON.stringify(payload)
  })
  .then(() => {
    // Karena menggunakan no-cors, responnya bersifat opaque (tidak bisa dibaca .json()),
    // tapi jika tidak masuk ke .catch berarti data BERHASIL terkirim ke Apps Script.
    alert("Transaksi berhasil dikirim!");
    
    btn.innerText = "Simpan Transaksi";
    btn.disabled = false;

    // Reset Form Input
    document.getElementById('kategori').value = '';
    document.getElementById('jumlah').value = '';
    document.getElementById('catatan').value = '';

    // Muat ulang data tabel setelah jeda 1.5 detik (memberi waktu Google Sheet menulis baris)
    setTimeout(muatData, 1500);
  })
  .catch(err => {
    console.error("Error simpan:", err);
    alert("Gagal menyimpan data! Cek koneksi / URL Apps Script.");
    btn.innerText = "Simpan Transaksi";
    btn.disabled = false;
  });
});

    // Jalankan saat pertama kali dibuka
    window.onload = muatData;
  </script>
</body>
</html>
